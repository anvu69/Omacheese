name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Catches the two bug classes that actually shipped in this repo:
  #   * whkdrc key names that VKey::from_keyname rejects (one kills whkd
  #     entirely, so every hotkey silently stops working)
  #   * config files that do not parse
  configs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem configs -Recurse -Filter *.json | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "ok   $($_.FullName)"
            } catch {
              Write-Host "FAIL $($_.FullName): $($_.Exception.Message)"
              $bad++
            }
          }
          if ($bad) { exit 1 }

      - name: Validate YAML and TOML
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, glob, tomllib, yaml
          bad = 0
          for f in glob.glob("configs/**/*.yaml", recursive=True) + glob.glob("configs/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(f, encoding="utf-8")); print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          for f in glob.glob("configs/**/*.toml", recursive=True):
              try:
                  tomllib.load(open(f, "rb")); print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Installer references only files that exist
        shell: pwsh
        run: |
          # The installers name repo files as strings. When one gets renamed the
          # script keeps running and simply installs less, which is how a
          # no-clone install once produced a desktop missing its menu launcher,
          # its scroll daemon and its whole theme system without erroring once.
          $scripts = @(
            "scripts/link-configs.ps1",
            "scripts/start-desktop.ps1",
            "scripts/install-windows.ps1",
            "scripts/setup.ps1",
            "scripts/doctor.ps1"
          )
          $bad = 0
          foreach ($s in $scripts) {
            $text = Get-Content -LiteralPath $s -Raw
            # Quoted paths that look like repo-relative files under configs/,
            # scripts/ or raycast/.
            $hits = [regex]::Matches($text, '"((?:configs|scripts|raycast)[\\/][^"]*?\.[A-Za-z0-9]+)"')
            foreach ($h in $hits) {
              $rel = $h.Groups[1].Value -replace '\\', '/'
              if (-not (Test-Path -LiteralPath $rel)) {
                Write-Host "FAIL $s references missing $rel"
                $bad++
              }
            }
          }
          if ($bad) { exit 1 } else { Write-Host "installer file references: all present" }

      - name: Validate whkdrc key names and chords
        shell: pwsh
        run: ./scripts/doctor.ps1 -Repo -Quick

      - name: whkdrc launches apps through the resolver, not bare names
        shell: pwsh
        run: |
          # `start "" <name>` is a ShellExecute lookup: PATH, then App Paths.
          # GUI installers register in neither, so this silently opened an empty
          # console window instead of the app. Measured on a working install:
          # `start "" brave` failed, `start "" brave.exe` worked, and alacritty
          # failed both ways. Sixteen bindings were dead that way.
          #
          # Apps go through omacheese-open.cmd. A URI protocol (ms-screenclip:)
          # is fine for `start`, since ShellExecute resolves those properly.
          $rc = Get-Content -LiteralPath configs/whkd/whkdrc
          $bad = 0
          foreach ($line in $rc) {
            if ($line -match '^\s*#') { continue }
            $m = [regex]::Match($line, '^\s*([a-z0-9_+\s]+?)\s*:\s*start ""\s+(\S+)')
            if (-not $m.Success) { continue }
            $target = $m.Groups[2].Value
            if ($target.EndsWith(':')) { continue }          # URI protocol, fine
            Write-Host "FAIL $($m.Groups[1].Value.Trim()) launches '$target' with start; use omacheese-open.cmd"
            $bad++
          }
          if ($bad) { exit 1 } else { Write-Host "whkdrc app launches: all go through the resolver" }

      - name: Validate Win11Debloat profile flags
        shell: pwsh
        run: |
          # Every flag in debloat.json must be a real parameter of the pinned
          # Win11Debloat.ps1. Same failure mode as a bad winget id: the script
          # would just ignore the setting and report success.
          $ref = (Select-String -Path scripts/debloat-windows.ps1 -Pattern '\$Ref\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "pinned ref: $ref"
          $zip = "$env:TEMP/w11d.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Raphire/Win11Debloat/archive/refs/tags/$ref.zip" -OutFile $zip
          Expand-Archive $zip "$env:TEMP/w11d" -Force
          $entry = Get-ChildItem "$env:TEMP/w11d" -Recurse -Filter Win11Debloat.ps1 | Select-Object -First 1
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($entry.FullName, [ref]$null, [ref]$null)
          $declared = $ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath }
          $used = (Get-Content configs/windows/debloat.json -Raw | ConvertFrom-Json).Settings.Name
          $bad = $used | Where-Object { $declared -notcontains $_ }
          if ($bad) { Write-Host "Not real Win11Debloat flags: $($bad -join ', ')"; exit 1 }
          Write-Host "all $($used.Count) profile flags valid (of $($declared.Count) declared)"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Theme templates render back to the committed configs
        shell: pwsh
        run: |
          # Two things can rot here: a template drifting from the config it is
          # supposed to produce, and a token that only some palettes define.
          function Read-Palette($path) {
            $m = @{}
            foreach ($line in Get-Content -LiteralPath $path) {
              $x = [regex]::Match($line, '^\s*(\w+)\s*=\s*"([^"]*)"')
              if ($x.Success) { $m[$x.Groups[1].Value] = $x.Groups[2].Value }
            }
            return $m
          }

          $pals = @{}
          foreach ($f in Get-ChildItem configs/theme -Filter *.toml) {
            $pals[[IO.Path]::GetFileNameWithoutExtension($f.Name)] = Read-Palette $f.FullName
          }
          if ($pals.Count -eq 0) { Write-Host "no palettes"; exit 1 }

          # Discovered, not listed. A hardcoded list here went stale twice already
          # in this repo, and a template nobody checks is a template that rots.
          # Not every template has a committed counterpart: the herdr config
          # renders straight to %APPDATA%, so the round-trip check below only
          # runs where the rendered file is actually in the repo.
          $pairs = Get-ChildItem configs -Recurse -Filter *.tmpl | ForEach-Object {
            @{ T = $_.FullName.Replace("$PWD\", "").Replace("\", "/")
               C = $_.FullName.Replace("$PWD\", "").Replace("\", "/") -replace '\.tmpl$', '' }
          }
          if ($pairs.Count -eq 0) { Write-Host "no templates found"; exit 1 }
          Write-Host "$($pairs.Count) templates discovered"

          $bad = 0
          foreach ($p in $pairs) {
            $tmpl = [IO.File]::ReadAllText($p.T)

            # Every token must exist in every palette, or switching theme leaves
            # a literal {{token}} in a config.
            $tokens = [regex]::Matches($tmpl, '\{\{(\w+)\}\}') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($name in $pals.Keys) {
              $miss = $tokens | Where-Object { -not $pals[$name].ContainsKey($_) }
              if ($miss) { Write-Host "FAIL $($p.T): palette '$name' lacks $($miss -join ', ')"; $bad++ }
            }

            # tokyo-night is what the committed files are rendered from.
            $rendered = [regex]::Replace($tmpl, '\{\{(\w+)\}\}', {
              param($m) $pals["tokyo-night"][$m.Groups[1].Value] })
            if (-not (Test-Path -LiteralPath $p.C)) {
              Write-Host "ok   $($p.T) (tokens only; renders outside the repo)"
              continue
            }
            $committed = [IO.File]::ReadAllText($p.C)
            if ($rendered -ne $committed) {
              Write-Host "FAIL $($p.C) is not render($($p.T), tokyo-night)"
              $bad++
            } else {
              Write-Host "ok   $($p.C)"
            }
          }
          if ($bad) { exit 1 }

      - name: Raycast script command metadata
        shell: pwsh
        run: |
          # A malformed header does not error - the command just never shows up
          # in Raycast, which is the worst kind of broken.
          $valid = @("fullOutput", "compact", "silent", "inline")
          $bad = 0
          $files = Get-ChildItem raycast -Filter *.ps1 | Where-Object { $_.Name -notlike "_*" }
          foreach ($f in $files) {
            $text = Get-Content -LiteralPath $f.FullName -Raw
            $meta = @{}
            foreach ($m in [regex]::Matches($text, '(?m)^#\s*@raycast\.(\w+)\s+(.*?)\s*$')) {
              $meta[$m.Groups[1].Value] = $m.Groups[2].Value
            }
            $missing = @("schemaVersion", "title", "mode") | Where-Object { -not $meta.ContainsKey($_) }
            if ($missing) { Write-Host "FAIL $($f.Name): missing $($missing -join ', ')"; $bad++; continue }
            if ($valid -notcontains $meta["mode"]) { Write-Host "FAIL $($f.Name): bad mode '$($meta['mode'])'"; $bad++; continue }
            foreach ($k in $meta.Keys) {
              if ($k -notlike "argument*") { continue }
              try { $null = $meta[$k] | ConvertFrom-Json }
              catch { Write-Host "FAIL $($f.Name): $k is not valid JSON"; $bad++ }
            }
            Write-Host "ok   $($f.Name)"
          }
          if ($bad) { exit 1 }

      - name: Raycast commands carry this project's package name
        shell: pwsh
        run: |
          # Raycast groups commands by packageName in its UI. A stale one from
          # before the rename puts them under someone else's project name.
          $bad = 0
          foreach ($f in Get-ChildItem raycast -Filter *.ps1 | Where-Object { $_.Name -notlike "_*" }) {
            $text = Get-Content -LiteralPath $f.FullName -Raw
            $m = [regex]::Match($text, '(?m)^#\s*@raycast\.packageName\s+(.*?)\s*$')
            if (-not $m.Success) { Write-Host "FAIL $($f.Name): no packageName"; $bad++; continue }
            if ($m.Groups[1].Value -ne "Omacheese") {
              Write-Host "FAIL $($f.Name): packageName is '$($m.Groups[1].Value)', expected Omacheese"; $bad++; continue
            }
            Write-Host "ok   $($f.Name)"
          }
          if ($bad) { exit 1 }

      - name: Every agent has a Windows and a Linux install line
        shell: pwsh
        run: |
          # omacheese-agent.ps1 -Wsl prints LinuxInstall when it finds no agent
          # inside the distro. An agent missing that field printed a blank line
          # where the fix should have been.
          . ./scripts/omacheese/omacheese-default-agent.ps1
          $bad = 0
          foreach ($k in $script:Agents.Keys) {
            foreach ($field in "Name", "Command", "Install", "LinuxInstall") {
              if (-not $script:Agents[$k][$field]) { Write-Host "FAIL ${k}: no $field"; $bad++ }
            }
          }
          # An agent whose install line drives mise must name the same tool in
          # its Mise field, and vice versa. They are read by different code -
          # the field by the launcher, the line by a human copying it - so they
          # drift silently if nothing compares them.
          foreach ($k in $script:Agents.Keys) {
            $a = $script:Agents[$k]
            $fromLine = $null
            foreach ($line in @($a.Install, $a.LinuxInstall)) {
              # '@' is in the class so node@lts is captured whole - without it
              # the match was 'node', which never equalled the value being
              # excluded and made gemini fail a check it should not be in.
              $m = [regex]::Match([string]$line, 'mise use -g ([A-Za-z0-9._@-]+)')
              # node is a language mise supplies, not the agent being installed.
              if ($m.Success -and $m.Groups[1].Value -notlike 'node*') { $fromLine = $m.Groups[1].Value; break }
            }
            if ($fromLine -and -not $a.Mise) {
              Write-Host "FAIL ${k}: installs with 'mise use -g $fromLine' but has no Mise field"; $bad++
            } elseif ($a.Mise -and $fromLine -and $a.Mise -ne $fromLine) {
              Write-Host "FAIL ${k}: Mise says '$($a.Mise)' but the install line says '$fromLine'"; $bad++
            }
          }

          Write-Host "$($script:Agents.Count) agents checked"
          if ($bad) { exit 1 }

      - name: Every irm-pipe-iex entry point survives iex
        shell: pwsh
        run: |
          # `irm URL | iex` runs the text in the CALLER's scope, so a param()
          # block declares its variables there. [ValidateSet] on a [string]
          # with no default then rejects the empty string that [string] made
          # from $null, and the script dies before running a line of itself.
          # That shipped: install.ps1 and bootstrap-windows.ps1 were both
          # broken this way, which is to say the documented install command
          # did not work at all.
          #
          # Entry points are discovered from the docs, so a new one is covered
          # the moment it is documented. No backslashes anywhere below on
          # purpose - [char]92 instead - because they do not survive every
          # editing path into this file.
          $sep = [char]92
          $entry = @{}
          foreach ($doc in Get-ChildItem -Recurse -Include *.md, *.ps1 -File) {
            if ($doc.FullName.Contains('.github')) { continue }
            foreach ($line in Get-Content -LiteralPath $doc.FullName) {
              if ($line -notmatch 'iex') { continue }
              foreach ($m in [regex]::Matches($line, '[^ "''`|]+[.]ps1')) {
                $parts = $m.Value.Replace($sep, '/') -split '/'
                for ($i = 0; $i -lt $parts.Count; $i++) {
                  $cand = ($parts[$i..($parts.Count - 1)]) -join '/'
                  if (Test-Path -LiteralPath $cand -PathType Leaf) { $entry[$cand] = $true; break }
                }
              }
            }
          }
          if ($entry.Count -eq 0) { Write-Host 'no irm|iex entry points found in the docs'; exit 1 }

          $bad = 0
          foreach ($rel in $entry.Keys | Sort-Object) {
            $text = Get-Content -LiteralPath $rel -Raw
            $pi = $text.IndexOf('param(')
            if ($pi -lt 0) { Write-Host "ok   $rel (no param block)"; continue }
            $end = $text.IndexOf("`n)", $pi)
            if ($end -lt 0) { Write-Host "FAIL ${rel}: could not find the end of param()"; $bad++; continue }
            # Param surface only: the body of these downloads and installs.
            $stub = $text.Substring(0, $end + 2) + "`n'ok'"
            try {
              $null = Invoke-Expression $stub
              Write-Host "ok   $rel"
            } catch {
              Write-Host "FAIL ${rel}: $($_.Exception.Message)"; $bad++
            }
          }
          if ($bad) { exit 1 }

      - name: README repo-layout trees name real paths
        shell: pwsh
        run: |
          # A tree in the README is documentation that silently goes stale.
          # Same class as a bad winget id or a bad whkd key name: a name that
          # refers to nothing, with nothing to notice it.
          $bad = 0
          foreach ($readme in "README.md", "README.vi.md") {
            $lines = Get-Content -LiteralPath $readme
            $start = -1; $end = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($start -lt 0 -and $lines[$i].Trim() -eq '```text' -and
                  $i + 1 -lt $lines.Count -and $lines[$i + 1] -like "install.ps1*") { $start = $i + 1; continue }
              if ($start -ge 0 -and $lines[$i].Trim() -eq '```') { $end = $i - 1; break }
            }
            if ($start -lt 0 -or $end -lt $start) {
              Write-Host "FAIL ${readme}: no repo-layout block"; $bad++; continue
            }
            $prefix = ""
            $fileBad = 0
            foreach ($line in $lines[$start..$end]) {
              if (-not $line.Trim()) { continue }
              $name = $line.Trim().Split(' ')[0]
              if ($line.StartsWith("  ")) {
                $target = "$prefix$name"
              } else {
                $prefix = if ($name.EndsWith("/")) { $name } else { "" }
                $target = $name
              }
              $path = $target.TrimEnd("/")
              if (-not (Test-Path -LiteralPath $path)) {
                Write-Host "FAIL ${readme}: $path does not exist"; $bad++; $fileBad++
              }
            }
            if (-not $fileBad) { Write-Host "ok   $readme" }
          }
          if ($bad) { exit 1 }

      - name: Template file names are unique
        shell: pwsh
        run: |
          # link-configs installs every configs/**/*.tmpl into one flat folder
          # under the leaf name, and the theme script looks them up the same way.
          # Two templates sharing a leaf would silently overwrite each other and
          # one config would quietly stop being themed.
          $leaves = Get-ChildItem configs -Recurse -Filter *.tmpl | Group-Object Name
          if (-not $leaves) { Write-Host 'no templates found'; exit 1 }
          $dupes = $leaves | Where-Object { $_.Count -gt 1 }
          foreach ($d in $dupes) {
            Write-Host "FAIL '$($d.Name)' is used by: $(($d.Group.FullName | ForEach-Object { Split-Path $_ -Parent | Split-Path -Leaf }) -join ', ')"
          }
          if ($dupes) { exit 1 }
          Write-Host "ok   $($leaves.Count) templates, all distinct"

      - name: Every module installs a group that exists
        shell: pwsh
        run: |
          # modules.ps1 asks for a winget group by name; packages.json defines
          # them. A module naming a group that is not there installs nothing and
          # reports success, which is the quietest possible failure.
          $manifest = Get-Content configs/winget/packages.json -Raw | ConvertFrom-Json
          $groups = $manifest.groups.PSObject.Properties.Name
          $mods = Get-Content scripts/lib/modules.ps1 -Raw
          $asked = [regex]::Matches($mods, 'InstallWindows -Groups @\("(\w+)"\)') |
                   ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $asked) { Write-Host 'no module groups found'; exit 1 }
          $bad = 0
          foreach ($a in $asked) {
            if ($groups -contains $a) { Write-Host "ok   module group '$a'" }
            else { Write-Host "FAIL module asks for group '$a', not in packages.json"; $bad++ }
          }
          # And the other way: a group nobody installs is dead weight.
          foreach ($g in $groups) {
            if ($asked -notcontains $g) { Write-Host "FAIL group '$g' exists but no module installs it"; $bad++ }
          }
          # Presets may only name modules that exist.
          $keys = [regex]::Matches($mods, 'New-Mod -Key "(\w+)"') | ForEach-Object { $_.Groups[1].Value }
          foreach ($m in [regex]::Matches($mods, 'Modules = @\(([^)]*)\)')) {
            foreach ($q in [regex]::Matches($m.Groups[1].Value, '"(\w+)"')) {
              $name = $q.Groups[1].Value
              if ($keys -notcontains $name) { Write-Host "FAIL preset names module '$name', which does not exist"; $bad++ }
            }
          }
          if ($bad) { exit 1 }

      - name: Module actions reference a real context member
        shell: pwsh
        run: |
          # modules.ps1 calls $ctx.Something; setup.ps1 builds $ctx. A name that
          # exists in one and not the other fails only when a user ticks that
          # module, which is the worst time to find out.
          $mods  = Get-Content scripts/lib/modules.ps1 -Raw
          $setup = Get-Content scripts/setup.ps1 -Raw
          $used = [regex]::Matches($mods, '\$ctx\.(\w+)') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $defined = [regex]::Matches($setup, '(?m)^\s{4}(\w+) = \{') | ForEach-Object { $_.Groups[1].Value }
          $bad = 0
          foreach ($u in $used) {
            if ($defined -contains $u) { Write-Host "ok   `$ctx.$u" }
            else { Write-Host "FAIL `$ctx.$u is not defined in setup.ps1"; $bad++ }
          }
          if ($used.Count -eq 0) { Write-Host "no `$ctx references found"; exit 1 }
          if ($bad) { exit 1 }

      - name: "No unregistered snippingtool: protocol"
        shell: pwsh
        run: |
          # Windows 11 dropped the snippingtool: handler; ms-screensketch: is
          # the registered one. Start-Process on a missing handler throws into
          # a hidden window, so the hotkey and the menu entry both did nothing.
          $hits = Get-ChildItem -Recurse -File -Include *.ps1, *.cmd, whkdrc |
                  Select-String -Pattern 'snippingtool:' -SimpleMatch
          if ($hits) { $hits | ForEach-Object { Write-Host "FAIL $($_.Path):$($_.LineNumber)" }; exit 1 }
          Write-Host "ok   no snippingtool: references"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Exclusions, and why each one is deliberate:
          #   WriteHost            - these are interactive installers, not cmdlets
          #   ShouldProcess        - same
          #   PositionalParameters - komorebic/winget calls read better positionally
          #   InvokeExpression     - `oh-my-posh init | iex` and `zoxide init | iex`
          #                          are the vendor-documented way to load them
          #   ApprovedVerbs        - user-facing shortcuts (reload-profile) and
          #                          internal helpers (Ensure-Dir) are not cmdlets
          #   GlobalVars           - bootstrap must read $global:repo, because
          #                          `irm ... | iex` is how it is invoked
          #   EmptyCatchBlock      - these scripts probe for optional things
          #                          (a config file, nvidia-smi, a registry key)
          #                          and fall back to a default that is already
          #                          assigned before the try. There is nothing
          #                          to report and nothing to recover.
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,
                         PSAvoidUsingPositionalParameters,PSAvoidUsingInvokeExpression,
                         PSUseApprovedVerbs,PSAvoidGlobalVars,PSAvoidUsingEmptyCatchBlock
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            if ($results | Where-Object Severity -eq 'Error') { exit 1 }
          } else {
            Write-Host "PSScriptAnalyzer: clean"
          }

      - name: Parse under Windows PowerShell 5.1
        shell: pwsh
        run: |
          # A clean Windows 11 install only has 5.1 until winget brings pwsh 7,
          # so everything the bootstrap touches has to parse there. PS7-only
          # syntax (?., ??, ternary) is a parse error on 5.1, which kills the
          # script before it prints anything.
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          # install.ps1 lives at the root and is the first thing a fresh machine runs,
          # where 5.1 is all there is - so it matters more than anything under scripts/.
          # Every .ps1 in the repo, discovered. The old three-directory list
          # missed configs/, and a list that has to be maintained by hand has
          # already gone stale three times here.
          $must = Get-ChildItem . -Recurse -Filter *.ps1 |
                  Where-Object { $_.FullName -notlike "*$([char]92).git$([char]92)*" } |
                  Sort-Object FullName -Unique
          $bad = 0
          foreach ($f in $must) {
            $out = & $ps51 -NoProfile -Command "
              `$e = `$null
              [System.Management.Automation.Language.Parser]::ParseFile('$($f.FullName)', [ref]`$null, [ref]`$e) | Out-Null
              if (`$e) { `$e[0].Message }" 2>&1
            if ($out) { Write-Host "FAIL $($f.Name): $out"; $bad++ }
            else { Write-Host "ok   $($f.Name)" }
          }
          if ($bad) { exit 1 }

      - name: Run the install path under Windows PowerShell 5.1
        shell: pwsh
        run: |
          # Parsing is not running. A fresh Windows 11 has only 5.1, install.ps1
          # runs there, it calls setup.ps1 with '&' in the same process, and
          # setup.ps1 spawns every sub-script with (Get-Process -Id $PID).Path -
          # so the whole scripts/ tree executes under 5.1, not just parses.
          #
          # The timeout is the point. -DryRun is documented for CI and remote
          # sessions, and it used to end at $Host.UI.RawUI.ReadKey, which blocks
          # forever when there is no console instead of failing.
          $ps51 = Join-Path $env:SystemRoot ('System32' + [char]92 + 'WindowsPowerShell' + [char]92 + 'v1.0' + [char]92 + 'powershell.exe')
          if (-not (Test-Path -LiteralPath $ps51)) { Write-Host 'no 5.1 on this runner'; exit 1 }

          $cases = @(
            @{ n = 'setup.ps1 -Preset everything -DryRun'; a = @('scripts/setup.ps1','-Preset','everything','-DryRun'); expect = 'Dry run' }
            @{ n = 'setup.ps1 -Modules core,cli -DryRun';  a = @('scripts/setup.ps1','-Modules','core,cli','-DryRun'); expect = 'Dry run' }
            @{ n = 'setup.ps1 -Preset custom -DryRun';     a = @('scripts/setup.ps1','-Preset','custom','-DryRun');    expect = '-Modules' }
            @{ n = 'doctor.ps1 -Repo -Quick';              a = @('scripts/doctor.ps1','-Repo','-Quick');               expect = 'passed' }
          )

          $bad = 0
          foreach ($c in $cases) {
            $job = Start-Job -ScriptBlock {
              param($exe, $argv)
              & $exe -NoProfile -ExecutionPolicy Bypass -File @argv 2>&1 | Out-String
            } -ArgumentList $ps51, $c.a
            if (Wait-Job $job -Timeout 180) {
              $out = (Receive-Job $job) -join ''
              if ($out -match [regex]::Escape($c.expect)) { Write-Host "ok   $($c.n)" }
              else {
                Write-Host "FAIL $($c.n): expected text '$($c.expect)' not found"
                Write-Host ($out -split "$BT" + "n" | Select-Object -Last 15 | Out-String)
                $bad++
              }
            } else {
              Write-Host "FAIL $($c.n): still running after 180s - it is waiting for a key"
              Stop-Job $job; $bad++
            }
            Remove-Job $job -Force
          }
          if ($bad) { exit 1 }

      - name: No PowerShell 7-only cmdlets in the 5.1 path
        shell: pwsh
        run: |
          # These parse fine on 5.1 and then fail at runtime, so the parse step
          # above cannot see them. Comment lines are skipped: link-configs.ps1
          # explains this very trap in prose and would otherwise flag itself.
          $patterns = @(
            @{ rx = 'ConvertFrom-Json[^|]*-AsHashtable'; why = '6+ only' }
            @{ rx = 'ConvertFrom-Json[^|]*-Depth';       why = '6.2+ only' }
            @{ rx = '-Encoding +utf8(NoBOM|BOM)';        why = '6+ only' }
            @{ rx = '-AsByteStream';                     why = '6+; 5.1 uses -Encoding Byte' }
            @{ rx = '-LeafBase';                         why = '6+ only' }
            @{ rx = 'ForEach-Object[^|]*-Parallel';      why = '7+ only' }
            @{ rx = 'Start-ThreadJob';                   why = 'not shipped with 5.1' }
            @{ rx = 'Get-Error';                         why = '7+ only' }
            @{ rx = 'PSStyle';                           why = '7.2+ only' }
            @{ rx = 'Join-String';                       why = '6.2+ only' }
            @{ rx = 'Test-Json';                         why = '6+ only' }
            @{ rx = 'Sort-Object[^|]*-Stable';           why = '6.2+ only' }
            @{ rx = '-SkipHttpErrorCheck';               why = '7+ only' }
            @{ rx = 'IsWindows|IsLinux|IsMacOS';         why = '6+; silently false on 5.1' }
            @{ rx = 'ValidateNotNullOrWhiteSpace';       why = '7.3+ only' }
            @{ rx = 'System.Text.Json';                  why = 'not in .NET Framework' }
          )
          $bad = 0
          foreach ($f in Get-ChildItem . -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notlike "*$([char]92).git$([char]92)*" }) {
            $n = 0
            foreach ($line in Get-Content -LiteralPath $f.FullName) {
              $n++
              if ($line.TrimStart().StartsWith('#')) { continue }
              foreach ($p in $patterns) {
                if ($line -match $p.rx) {
                  Write-Host "FAIL $($f.Name):${n} uses $($Matches[0]) - $($p.why)"
                  $bad++
                }
              }
            }
          }
          if ($bad) { exit 1 }
          Write-Host 'ok   no PowerShell 7-only constructs'

      - name: Parse every script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
              $bad++
            } else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad) { exit 1 }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh configs/wsl/*.sh

      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh
          # Globbed: naming the files here meant a new one silently went
          # unchecked, which is how agent-layouts.zsh nearly shipped unparsed.
          shopt -s nullglob
          files=(configs/zsh/zshrc configs/zsh/*.zsh)
          [ ${#files[@]} -gt 0 ] || { echo "no zsh files found"; exit 1; }
          for f in "${files[@]}"; do
            zsh -n "$f" && echo "ok   $f"
          done

  winget-ids:
    # Package ids are the other thing that broke here: bootstrap shipped
    # "amnweb.yasb" and install shipped "dbeaver.dbeaver", neither of which
    # resolves. Scheduled so upstream renames surface before a user hits them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve every winget id
        shell: pwsh
        run: |
          $manifest = Get-Content configs/winget/packages.json -Raw | ConvertFrom-Json
          $pkgs = $manifest.groups.PSObject.Properties.Value.packages
          $bad = @()
          foreach ($pkg in $pkgs) {
            # A package may name its own source; Raycast is only on msstore.
            $args = @("show", "--id", $pkg.id, "-e", "--disable-interactivity", "--accept-source-agreements")
            if ($pkg.PSObject.Properties.Name -contains "source" -and $pkg.source) {
              $args += @("--source", $pkg.source)
            }
            $out = winget @args 2>&1 | Out-String
            if ($out -match "No package found") { Write-Host "FAIL $($pkg.id)"; $bad += $pkg.id }
            else { Write-Host "ok   $($pkg.id)" }
          }
          if ($bad.Count) {
            Write-Host "`nUnresolvable ids: $($bad -join ', ')"
            exit 1
          }
