name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Catches the two bug classes that actually shipped in this repo:
  #   * whkdrc key names that VKey::from_keyname rejects (one kills whkd
  #     entirely, so every hotkey silently stops working)
  #   * config files that do not parse
  configs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem configs -Recurse -Filter *.json | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "ok   $($_.FullName)"
            } catch {
              Write-Host "FAIL $($_.FullName): $($_.Exception.Message)"
              $bad++
            }
          }
          if ($bad) { exit 1 }

      - name: Validate YAML and TOML
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys, glob, tomllib, yaml
          bad = 0
          for f in glob.glob("configs/**/*.yaml", recursive=True) + glob.glob("configs/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(f, encoding="utf-8")); print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          for f in glob.glob("configs/**/*.toml", recursive=True):
              try:
                  tomllib.load(open(f, "rb")); print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Installer references only files that exist
        shell: pwsh
        run: |
          # The installers name repo files as strings. When one gets renamed the
          # script keeps running and simply installs less, which is how a
          # no-clone install once produced a desktop missing its menu launcher,
          # its scroll daemon and its whole theme system without erroring once.
          $scripts = @(
            "scripts/link-configs.ps1",
            "scripts/start-desktop.ps1",
            "scripts/install-windows.ps1",
            "scripts/setup.ps1",
            "scripts/doctor.ps1"
          )
          $bad = 0
          foreach ($s in $scripts) {
            $text = Get-Content -LiteralPath $s -Raw
            # Quoted paths that look like repo-relative files under configs/,
            # scripts/ or raycast/.
            $hits = [regex]::Matches($text, '"((?:configs|scripts|raycast)[\\/][^"]*?\.[A-Za-z0-9]+)"')
            foreach ($h in $hits) {
              $rel = $h.Groups[1].Value -replace '\\', '/'
              if (-not (Test-Path -LiteralPath $rel)) {
                Write-Host "FAIL $s references missing $rel"
                $bad++
              }
            }
          }
          if ($bad) { exit 1 } else { Write-Host "installer file references: all present" }

      - name: Validate whkdrc key names and chords
        shell: pwsh
        run: ./scripts/doctor.ps1 -Repo -Quick

      - name: whkdrc launches apps through the resolver, not bare names
        shell: pwsh
        run: |
          # `start "" <name>` is a ShellExecute lookup: PATH, then App Paths.
          # GUI installers register in neither, so this silently opened an empty
          # console window instead of the app. Measured on a working install:
          # `start "" brave` failed, `start "" brave.exe` worked, and alacritty
          # failed both ways. Sixteen bindings were dead that way.
          #
          # Apps go through omacheese-open.cmd. A URI protocol (ms-screenclip:)
          # is fine for `start`, since ShellExecute resolves those properly.
          $rc = Get-Content -LiteralPath configs/whkd/whkdrc
          $bad = 0
          foreach ($line in $rc) {
            if ($line -match '^\s*#') { continue }
            $m = [regex]::Match($line, '^\s*([a-z0-9_+\s]+?)\s*:\s*start ""\s+(\S+)')
            if (-not $m.Success) { continue }
            $target = $m.Groups[2].Value
            if ($target.EndsWith(':')) { continue }          # URI protocol, fine
            Write-Host "FAIL $($m.Groups[1].Value.Trim()) launches '$target' with start; use omacheese-open.cmd"
            $bad++
          }
          if ($bad) { exit 1 } else { Write-Host "whkdrc app launches: all go through the resolver" }

      - name: Validate Win11Debloat profile flags
        shell: pwsh
        run: |
          # Every flag in debloat.json must be a real parameter of the pinned
          # Win11Debloat.ps1. Same failure mode as a bad winget id: the script
          # would just ignore the setting and report success.
          $ref = (Select-String -Path scripts/debloat-windows.ps1 -Pattern '\$Ref\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "pinned ref: $ref"
          $zip = "$env:TEMP/w11d.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Raphire/Win11Debloat/archive/refs/tags/$ref.zip" -OutFile $zip
          Expand-Archive $zip "$env:TEMP/w11d" -Force
          $entry = Get-ChildItem "$env:TEMP/w11d" -Recurse -Filter Win11Debloat.ps1 | Select-Object -First 1
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($entry.FullName, [ref]$null, [ref]$null)
          $declared = $ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath }
          $used = (Get-Content configs/windows/debloat.json -Raw | ConvertFrom-Json).Settings.Name
          $bad = $used | Where-Object { $declared -notcontains $_ }
          if ($bad) { Write-Host "Not real Win11Debloat flags: $($bad -join ', ')"; exit 1 }
          Write-Host "all $($used.Count) profile flags valid (of $($declared.Count) declared)"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Theme templates render back to the committed configs
        shell: pwsh
        run: |
          # Two things can rot here: a template drifting from the config it is
          # supposed to produce, and a token that only some palettes define.
          function Read-Palette($path) {
            $m = @{}
            foreach ($line in Get-Content -LiteralPath $path) {
              $x = [regex]::Match($line, '^\s*(\w+)\s*=\s*"([^"]*)"')
              if ($x.Success) { $m[$x.Groups[1].Value] = $x.Groups[2].Value }
            }
            return $m
          }

          $pals = @{}
          foreach ($f in Get-ChildItem configs/theme -Filter *.toml) {
            $pals[[IO.Path]::GetFileNameWithoutExtension($f.Name)] = Read-Palette $f.FullName
          }
          if ($pals.Count -eq 0) { Write-Host "no palettes"; exit 1 }

          $pairs = @(
            @{ T = "configs/komorebi/komorebi.json.tmpl";   C = "configs/komorebi/komorebi.json" }
            @{ T = "configs/yasb/styles.css.tmpl";          C = "configs/yasb/styles.css" }
            @{ T = "configs/alacritty/alacritty.toml.tmpl"; C = "configs/alacritty/alacritty.toml" }
          )

          $bad = 0
          foreach ($p in $pairs) {
            $tmpl = [IO.File]::ReadAllText($p.T)

            # Every token must exist in every palette, or switching theme leaves
            # a literal {{token}} in a config.
            $tokens = [regex]::Matches($tmpl, '\{\{(\w+)\}\}') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($name in $pals.Keys) {
              $miss = $tokens | Where-Object { -not $pals[$name].ContainsKey($_) }
              if ($miss) { Write-Host "FAIL $($p.T): palette '$name' lacks $($miss -join ', ')"; $bad++ }
            }

            # tokyo-night is what the committed files are rendered from.
            $rendered = [regex]::Replace($tmpl, '\{\{(\w+)\}\}', {
              param($m) $pals["tokyo-night"][$m.Groups[1].Value] })
            $committed = [IO.File]::ReadAllText($p.C)
            if ($rendered -ne $committed) {
              Write-Host "FAIL $($p.C) is not render($($p.T), tokyo-night)"
              $bad++
            } else {
              Write-Host "ok   $($p.C)"
            }
          }
          if ($bad) { exit 1 }

      - name: Raycast script command metadata
        shell: pwsh
        run: |
          # A malformed header does not error - the command just never shows up
          # in Raycast, which is the worst kind of broken.
          $valid = @("fullOutput", "compact", "silent", "inline")
          $bad = 0
          $files = Get-ChildItem raycast -Filter *.ps1 | Where-Object { $_.Name -notlike "_*" }
          foreach ($f in $files) {
            $text = Get-Content -LiteralPath $f.FullName -Raw
            $meta = @{}
            foreach ($m in [regex]::Matches($text, '(?m)^#\s*@raycast\.(\w+)\s+(.*?)\s*$')) {
              $meta[$m.Groups[1].Value] = $m.Groups[2].Value
            }
            $missing = @("schemaVersion", "title", "mode") | Where-Object { -not $meta.ContainsKey($_) }
            if ($missing) { Write-Host "FAIL $($f.Name): missing $($missing -join ', ')"; $bad++; continue }
            if ($valid -notcontains $meta["mode"]) { Write-Host "FAIL $($f.Name): bad mode '$($meta['mode'])'"; $bad++; continue }
            foreach ($k in $meta.Keys) {
              if ($k -notlike "argument*") { continue }
              try { $null = $meta[$k] | ConvertFrom-Json }
              catch { Write-Host "FAIL $($f.Name): $k is not valid JSON"; $bad++ }
            }
            Write-Host "ok   $($f.Name)"
          }
          if ($bad) { exit 1 }

      - name: Raycast commands carry this project's package name
        shell: pwsh
        run: |
          # Raycast groups commands by packageName in its UI. A stale one from
          # before the rename puts them under someone else's project name.
          $bad = 0
          foreach ($f in Get-ChildItem raycast -Filter *.ps1 | Where-Object { $_.Name -notlike "_*" }) {
            $text = Get-Content -LiteralPath $f.FullName -Raw
            $m = [regex]::Match($text, '(?m)^#\s*@raycast\.packageName\s+(.*?)\s*$')
            if (-not $m.Success) { Write-Host "FAIL $($f.Name): no packageName"; $bad++; continue }
            if ($m.Groups[1].Value -ne "Omacheese") {
              Write-Host "FAIL $($f.Name): packageName is '$($m.Groups[1].Value)', expected Omacheese"; $bad++; continue
            }
            Write-Host "ok   $($f.Name)"
          }
          if ($bad) { exit 1 }

      - name: Every agent has a Windows and a Linux install line
        shell: pwsh
        run: |
          # omacheese-agent.ps1 -Wsl prints LinuxInstall when it finds no agent
          # inside the distro. An agent missing that field printed a blank line
          # where the fix should have been.
          . ./scripts/omacheese/omacheese-default-agent.ps1
          $bad = 0
          foreach ($k in $script:Agents.Keys) {
            foreach ($field in "Name", "Command", "Install", "LinuxInstall") {
              if (-not $script:Agents[$k][$field]) { Write-Host "FAIL ${k}: no $field"; $bad++ }
            }
          }
          Write-Host "$($script:Agents.Count) agents checked"
          if ($bad) { exit 1 }

      - name: "No unregistered snippingtool: protocol"
        shell: pwsh
        run: |
          # Windows 11 dropped the snippingtool: handler; ms-screensketch: is
          # the registered one. Start-Process on a missing handler throws into
          # a hidden window, so the hotkey and the menu entry both did nothing.
          $hits = Get-ChildItem -Recurse -File -Include *.ps1, *.cmd, whkdrc |
                  Select-String -Pattern 'snippingtool:' -SimpleMatch
          if ($hits) { $hits | ForEach-Object { Write-Host "FAIL $($_.Path):$($_.LineNumber)" }; exit 1 }
          Write-Host "ok   no snippingtool: references"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          # Exclusions, and why each one is deliberate:
          #   WriteHost            - these are interactive installers, not cmdlets
          #   ShouldProcess        - same
          #   PositionalParameters - komorebic/winget calls read better positionally
          #   InvokeExpression     - `oh-my-posh init | iex` and `zoxide init | iex`
          #                          are the vendor-documented way to load them
          #   ApprovedVerbs        - user-facing shortcuts (reload-profile) and
          #                          internal helpers (Ensure-Dir) are not cmdlets
          #   GlobalVars           - bootstrap must read $global:repo, because
          #                          `irm ... | iex` is how it is invoked
          #   EmptyCatchBlock      - these scripts probe for optional things
          #                          (a config file, nvidia-smi, a registry key)
          #                          and fall back to a default that is already
          #                          assigned before the try. There is nothing
          #                          to report and nothing to recover.
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,
                         PSAvoidUsingPositionalParameters,PSAvoidUsingInvokeExpression,
                         PSUseApprovedVerbs,PSAvoidGlobalVars,PSAvoidUsingEmptyCatchBlock
          if ($results) {
            $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            if ($results | Where-Object Severity -eq 'Error') { exit 1 }
          } else {
            Write-Host "PSScriptAnalyzer: clean"
          }

      - name: Parse under Windows PowerShell 5.1
        shell: pwsh
        run: |
          # A clean Windows 11 install only has 5.1 until winget brings pwsh 7,
          # so everything the bootstrap touches has to parse there. PS7-only
          # syntax (?., ??, ternary) is a parse error on 5.1, which kills the
          # script before it prints anything.
          $ps51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          # install.ps1 lives at the root and is the first thing a fresh machine runs,
          # where 5.1 is all there is - so it matters more than anything under scripts/.
          $must = @(Get-ChildItem . -Filter *.ps1) +
                  @(Get-ChildItem scripts -Recurse -Filter *.ps1) +
                  @(Get-ChildItem raycast -Filter *.ps1)
          $must = $must | Sort-Object FullName -Unique
          $bad = 0
          foreach ($f in $must) {
            $out = & $ps51 -NoProfile -Command "
              `$e = `$null
              [System.Management.Automation.Language.Parser]::ParseFile('$($f.FullName)', [ref]`$null, [ref]`$e) | Out-Null
              if (`$e) { `$e[0].Message }" 2>&1
            if ($out) { Write-Host "FAIL $($f.Name): $out"; $bad++ }
            else { Write-Host "ok   $($f.Name)" }
          }
          if ($bad) { exit 1 }

      - name: Parse every script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              Write-Host "FAIL $($_.Name)"
              $errs | ForEach-Object { Write-Host "   line $($_.Extent.StartLineNumber): $($_.Message)" }
              $bad++
            } else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad) { exit 1 }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh configs/wsl/*.sh

      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh
          zsh -n configs/zsh/zshrc
          zsh -n configs/zsh/aliases.zsh

  winget-ids:
    # Package ids are the other thing that broke here: bootstrap shipped
    # "amnweb.yasb" and install shipped "dbeaver.dbeaver", neither of which
    # resolves. Scheduled so upstream renames surface before a user hits them.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve every winget id
        shell: pwsh
        run: |
          $manifest = Get-Content configs/winget/packages.json -Raw | ConvertFrom-Json
          $pkgs = $manifest.groups.PSObject.Properties.Value.packages
          $bad = @()
          foreach ($pkg in $pkgs) {
            # A package may name its own source; Raycast is only on msstore.
            $args = @("show", "--id", $pkg.id, "-e", "--disable-interactivity", "--accept-source-agreements")
            if ($pkg.PSObject.Properties.Name -contains "source" -and $pkg.source) {
              $args += @("--source", $pkg.source)
            }
            $out = winget @args 2>&1 | Out-String
            if ($out -match "No package found") { Write-Host "FAIL $($pkg.id)"; $bad += $pkg.id }
            else { Write-Host "ok   $($pkg.id)" }
          }
          if ($bad.Count) {
            Write-Host "`nUnresolvable ids: $($bad -join ', ')"
            exit 1
          }
