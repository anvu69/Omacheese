# ~/.tmux.conf - WSL2 AlmaLinux

# --- Terminal ---------------------------------------------------------------
# tmux-256color (not screen-256color) is what enables italics and, with the
# override below, 24-bit colour. Alacritty is a truecolor terminal, so
# screen-256color visibly degrades every theme in this repo.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",alacritty:Tc"

# Let nvim's autoread and vim-tmux-navigator see focus changes.
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g display-time 2000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# --- Prefix -----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Splits and windows -----------------------------------------------------
# Open new panes/windows in the current directory instead of $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# --- Pane navigation (matches the komorebi/Omarchy muscle memory) ------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+arrows move between panes without the prefix.
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# --- Copy mode --------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind Escape copy-mode

# clip.exe is the reliable way out of WSL into the Windows clipboard.
if-shell 'command -v clip.exe' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"'

# --- Status bar (Omarchy Tokyo Night) ---------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7] "

set -g status-right-length 60
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#bb9af7]PREFIX ,}#[fg=#565f89]%H:%M #[fg=#7aa2f7]#h "

setw -g window-status-format "#[fg=#414868] #I #W "
setw -g window-status-current-format "#[fg=#c0caf5,bold] #I #W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#24283b,fg=#c0caf5"
