# /etc/wsl.conf  (inside the AlmaLinux distro, needs sudo to install)
#
# Per-distro settings. Install with:
#   sudo cp configs/wsl/wsl.conf /etc/wsl.conf
# then from Windows:
#   wsl --shutdown

[boot]
# systemd lets you run services (docker, podman, sshd, timers) the normal way
# instead of hand-rolling init scripts.
systemd=true

[automount]
enabled=true
# metadata makes chmod/chown stick on /mnt/c, which git needs to stop
# reporting every Windows file as mode 100755.
options="metadata,umask=22,fmask=11"
mountFsTab=true

[network]
generateHosts=true
# Leave generateResolvConf on unless you manage /etc/resolv.conf yourself.
# With dnsTunneling=true in .wslconfig this is usually the right combination.
generateResolvConf=true

[interop]
enabled=true
# Do NOT append the whole Windows PATH into the Linux shell. It is the single
# biggest cause of slow tab-completion in WSL, and it shadows Linux binaries
# with Windows ones (python, node and git are the usual casualties).
# Windows executables remain reachable by full name, e.g. `explorer.exe .`
appendWindowsPath=false

[user]
# Replace with your Linux username so `wsl` drops you in as a normal user.
# default=youruser
