# Alacritty - WSL2 AlmaLinux shell.
#
# Use with:
#   alacritty --config-file %APPDATA%\alacritty\alacritty.wsl.toml
#
# The previous version of this file set program = "wsl.exe" but passed
# PowerShell arguments to it, so it could never launch. wsl.exe takes wsl
# arguments; everything after `--` is the command run inside the distro.
#
# Change the distro name if `wsl -l -v` reports something other than
# AlmaLinux-9.

[general]
import = ["alacritty.toml"]

[terminal.shell]
program = "wsl.exe"
args = ["-d", "AlmaLinux-9", "--cd", "~"]

[window]
startup_mode = "Windowed"
