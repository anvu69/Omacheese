# ============================================================================
#  yasb - Omarchy-style top bar for komorebi
# ============================================================================
#  Layout mirrors the Omarchy bar (manual/05-the-top-bar.md):
#    left   menu launcher + workspace indicators + active layout
#    center clock
#    right  system readouts, then power
#
#  Workspace indicators follow the Omarchy convention: every workspace is a
#  dot, and the focused one expands to its name. Colours live in styles.css.
#
#  Widget option names were taken from a working YASB Reborn 2.0.x config -
#  they are version-sensitive, so check the wiki before inventing new ones:
#  https://github.com/amnweb/yasb/wiki
# ============================================================================

watch_stylesheet: true
watch_config: true
debug: false

komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  reload_command: "komorebic stop --whkd && komorebic start --whkd"

bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
      # `center: false` was deprecated in 2.0.x in favour of `align`.
      align: "left"
    blur_effect:
      enabled: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 0
      left: 8
      bottom: 0
      # More on the right: the last widget is icon-only and was being clipped
      # by the bar edge.
      right: 14
    widgets:
      left:
        - "omarchy_menu"
        - "komorebi_workspaces"
        - "komorebi_active_layout"
        - "active_window"
      center:
        - "clock"
      right:
        - "cpu"
        - "memory"
        - "volume"
        - "bluetooth"
        - "wifi"
        - "battery"
        - "power_menu"

widgets:

  # The Omarchy logo slot: one click opens the same menu as SUPER+SPACE.
  omarchy_menu:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span></span>"
      label_alt: "<span></span>"
      class_name: "omarchy-menu-widget"
      # MUST go through cmd.exe. yasb runs callbacks with subprocess.Popen and
      # no shell, so %USERPROFILE% is never expanded and a bare binary name is
      # looked up in whatever PATH yasb inherited - which, for a bar started
      # from a stale session, may not contain it. The .cmd wrappers expand the
      # path and locate the binary themselves.
      #
      # on_left opens the menu as a real window (WPF, no terminal); on_right
      # still opens the keybinding cheatsheet in a terminal, because it is fzf.
      callbacks:
        on_left: "exec cmd.exe /c %USERPROFILE%\\.config\\omarchy\\bin\\omarchy-menu.cmd"
        on_right: "exec cmd.exe /c %USERPROFILE%\\.config\\omarchy\\bin\\omarchy-term.cmd %USERPROFILE%\\.config\\omarchy\\bin\\omarchy-keybindings.ps1"

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "󰸹 offline"
      # Empty and populated stay as dots; the active workspace shows its name.
      label_workspace_btn: ""
      label_workspace_populated_btn: ""
      label_workspace_active_btn: "{name}"
      label_default_name: "{index}"
      label_zero_index: false
      # Omarchy-style: the bar shows what is in use, not ten slots you
      # might one day fill. The focused workspace stays visible even when
      # empty, and SUPER+1..0 still reaches all ten regardless.
      hide_empty_workspaces: true
      hide_if_offline: false
      enable_scroll_switching: true
      reverse_scroll_direction: false
      # Off on purpose: komorebi_active_layout sits immediately to the
      # right and already draws a layout glyph, so enabling this put two
      # near-identical icons side by side. SUPER+SHIFT+SPACE still
      # toggles the layer and the layout widget reflects it.
      toggle_workspace_layer:
        enabled: false
      app_icons:
        enabled_populated: false
        enabled_active: false
        size: 14
        max_icons: 4
        hide_label: false
        hide_duplicates: true
        hide_floating: false

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts:
        - "bsp"
        - "columns"
        - "rows"
        - "grid"
        - "vertical_stack"
        - "horizontal_stack"
        - "ultrawide_vertical_stack"
        - "right_main_vertical_stack"
        - "scrolling"
      layout_icons:
        bsp: ""
        columns: ""
        rows: ""
        grid: "󰝘"
        scrolling: ""
        vertical_stack: ""
        horizontal_stack: ""
        ultrawide_vertical_stack: ""
        right_main_vertical_stack: ""
        monocle: ""
        maximized: ""
        floating: ""
        paused: "󰾉"
        tiling: "󰙀"

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: false
      max_length: 48
      max_length_ellipsis: "…"
      monitor_exclusive: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%A %d %B %Y  %H:%M:%S}"
      timezones: []

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span></span> {info[percent][total]}%"
      label_alt: "<span></span> {info[histograms][cpu_percent]}"
      update_interval: 2000

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span></span> {virtual_mem_percent}%"
      label_alt: "<span></span> {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{icon} {level}"
      # `volume_icons` as a list was deprecated in 2.0.x. The dict form keys
      # on the upper bound of each volume band.
      # Three audible bands is plenty, and none of them is a slashed
      # speaker: a slash reads as 'no sound', which is wrong at 1-10%
      # where the sound is simply quiet. The crossed speaker is kept
      # for `muted` only, which is the one state that means silence.
      icons:
        muted: "󰝟"
        "33": "󰕿"
        "66": "󰖀"
        "100": "󰕾"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "exec cmd.exe /c start ms-settings:sound"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "{wifi_name} {wifi_strength}%"
      update_interval: 10000
      ethernet_icon: "󰈀"
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd.exe /c start ms-settings:network"

  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      label_no_device: ""
      label_device_separator: ", "
      max_length: 16
      max_length_ellipsis: "…"
      tooltip: true
      icons:
        bluetooth_on: "󰂯"
        bluetooth_off: "󰂱"
        bluetooth_connected: "󰂰"
      callbacks:
        on_left: "toggle_menu"
        on_right: "exec cmd.exe /c start ms-settings:bluetooth"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "{icon} {percent}% | {time_remaining}"
      # Default is already true; stated explicitly because it is what makes
      # this config portable - the widget removes itself on a desktop instead
      # of showing a meaningless 0%.
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<span></span>"
      uptime: true
      blur: false
      blur_background: true
      animation_duration: 200
      button_row: 3
      buttons:
        lock: ["", "Lock"]
        signout: ["", "Sign out"]
        sleep: ["", "Sleep"]
        restart: ["", "Restart"]
        shutdown: ["", "Shut Down"]
        cancel: ["", "Cancel"]
